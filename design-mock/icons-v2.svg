<!-- CoI Companion — icon set v2 (DESIGN.md addendum V2.4).
     Style contract: 24x24 grid, fill none, stroke currentColor,
     stroke-width 2, round caps and joins. Exceptions: i-play and
     i-pause are FILLED glyphs (fill currentColor, no stroke) — the
     media pair reads at 12px where strokes vanish.
     Usage in serve.rs: paste the <symbol> defs into one hidden
     inline <svg> at the top of <body>, then
     <svg class="ic"><use href="#i-power"/></svg> with
     .ic{width:16px;height:16px;flex:none}. Colour comes from
     color: on the parent — never set fill/stroke per use site. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <g id="ic-style" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="i-power" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </g>
  </symbol>

  <symbol id="i-users" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </g>
  </symbol>

  <symbol id="i-wheat" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 10c-3.5 0-5.5-2-5.5-5.5C10 4.5 12 6.5 12 10Z"/>
      <path d="M12 10c3.5 0 5.5-2 5.5-5.5C14 4.5 12 6.5 12 10Z"/>
      <path d="M12 16.5c-2.8 0-4.6-1.4-5-4 2.8 0 4.6 1.4 5 4Z"/>
      <path d="M12 16.5c2.8 0 4.6-1.4 5-4-2.8 0-4.6 1.4-5 4Z"/>
      <path d="M12 10v12"/>
    </g>
  </symbol>

  <symbol id="i-flask" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3h6"/>
      <path d="M10 3v5.5L4.8 18.5A2 2 0 0 0 6.6 21.5h10.8a2 2 0 0 0 1.8-3L14 8.5V3"/>
      <path d="M7.8 15h8.4"/>
    </g>
  </symbol>

  <symbol id="i-box" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
      <line x1="12" y1="22.08" x2="12" y2="12"/>
    </g>
  </symbol>

  <symbol id="i-factory" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21V11l5 3.5V11l5 3.5V7h8v14"/>
      <path d="M3 21h18"/>
      <path d="M16.5 11h.01M16.5 15h.01"/>
    </g>
  </symbol>

  <symbol id="i-alert" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </g>
  </symbol>

  <symbol id="i-check" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </g>
  </symbol>

  <symbol id="i-clock" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <polyline points="12 7 12 12 15.5 14"/>
    </g>
  </symbol>

  <symbol id="i-truck" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3" width="15" height="13" rx="1"/>
      <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
      <circle cx="5.5" cy="18.5" r="2.5"/>
      <circle cx="18.5" cy="18.5" r="2.5"/>
    </g>
  </symbol>

  <symbol id="i-anchor" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="5" r="3"/>
      <line x1="12" y1="22" x2="12" y2="8"/>
      <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
    </g>
  </symbol>

  <symbol id="i-train" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="3" width="14" height="13" rx="2"/>
      <path d="M5 9.5h14"/>
      <path d="M9 13h.01M15 13h.01"/>
      <path d="M9 21l1.8-5M15 21l-1.8-5"/>
    </g>
  </symbol>

  <symbol id="i-chart" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="20" x2="12" y2="10"/>
      <line x1="18" y1="20" x2="18" y2="4"/>
      <line x1="6" y1="20" x2="6" y2="16"/>
    </g>
  </symbol>

  <symbol id="i-up" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"/>
      <polyline points="5 12 12 5 19 12"/>
    </g>
  </symbol>

  <symbol id="i-down" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <polyline points="19 12 12 19 5 12"/>
    </g>
  </symbol>

  <symbol id="i-flat" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="12" x2="20" y2="12"/>
      <polyline points="8 8 4 12 8 16"/>
      <polyline points="16 8 20 12 16 16"/>
    </g>
  </symbol>

  <symbol id="i-play" viewBox="0 0 24 24">
    <polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>
  </symbol>

  <symbol id="i-pause" viewBox="0 0 24 24">
    <g fill="currentColor">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </g>
  </symbol>

  <symbol id="i-layers" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"/>
      <polyline points="2 17 12 22 22 17"/>
      <polyline points="2 12 12 17 22 12"/>
    </g>
  </symbol>

  <symbol id="i-search" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.5" y2="16.5"/>
    </g>
  </symbol>
</svg>
