# fresh-start-v1 — Captains of Industry, New Haven, normal difficulty, Update 4.
#
# Format: ../GAME-PLAN-FORMAT.md (Game-Plan Format v1). Read it first; this
# file uses only its closed predicate vocabulary, its order kinds, and its
# placeholder-with-warning convention for unsourced ids.
#
# Content source: the local-coi-starter skill (SKILL.md + references/
# phases.md, research-order.md, layout-policy.md, bottlenecks.md), with
# research node ids cross-checked against the game's extracted id list
# (coi/data/research_ids.txt) and product ids against the live product
# catalogue (live/products.json). Uncertainty in the sources is carried
# here as flags: / placeholder mappings — never laundered into facts.
#
# Thresholds (stockpile numbers, floors) are PLAN-SET TARGETS chosen by the
# plan author, not game facts. They are deliberately conservative for a
# first supervised run and are expected to be tuned after a sandbox run.

plan:
  id: fresh-start
  version: 1.2.1
  title: "Fresh start — New Haven (normal, Update 4) to self-sufficiency + first rail"
  map: {name: "New Haven", difficulty: normal}
  game_version: "0.8.8"            # Update 4.3, per SPEC baseline
  dlc: [trains-expansion]          # owned (starter skill); only phase 7 needs it
  author: "Claudius (overnight build, 2026-11-02)"
  created: 2026-11-02
  requires:
    companion: ">= website build with generic command flow (13 verified / 226 wired / 1 excluded)"
    bridge: ">=0.5.0"              # no phase in this plan reads v0.6 routes
  end_state: >-
    Phase 7 exit gate met: a first train network and line exist, the
    settlement is food-secure, and every permanent district from the
    layout policy is placed. The plan then halts and hands the run back
    with a run report. Mid/late-game progression (Advanced Diesel at
    scale, coal power beyond the first boiler, offshore oil) is the
    next plan's job, not this one's.
  assumptions:
    - claim: "Starting area contains an abandoned comms station with free scrap iron and reportedly ~600 concrete slabs; oil patch NE of the start, coal nearby, limestone fairly close, iron a fair distance away, coast/docks to the south."
      source: "layout-policy.md — reported hypothesis, NOT confirmed tile-level truth"
      status: hypothesis
    - claim: "Starting settlement is ~100 population against ~160 housing capacity in shipping containers; refugees arrive in waves of 16."
      source: "layout-policy.md (reported) + research-order.md (16 per wave)"
      status: hypothesis
    - claim: "The starting ship's hold carries several hundred units of copper, covering early electronics until copper refining is online."
      source: "layout-policy.md — reported"
      status: hypothesis
    - claim: "A fresh game starts with some diesel stock (vehicles and the first diesel generator run before any diesel chain exists), so the diesel invariant in globals can be armed from t0."
      source: "inferred from starter phase 1 (diesel generator is a phase-1 build)"
      status: hypothesis
      confirm: "Phase 0 scout verifies Product_Diesel quantity > 0; if it is 0, a human amends globals.invariants before the game is unpaused."
    - claim: "Research display names in the starter skill map to game node ids as recorded per-order in the phases below; mappings not marked 'sourced-id' are candidates or placeholders."
      source: "research-order.md + research-tree.md (display-name verification) cross-checked against coi/data/research_ids.txt (extracted game ids)"
      status: mixed-per-order
    - claim: "The phase-2 entry placeholder Research<Construction> (display name 'Construction') was re-investigated 2026-11-03 (plan v1.2.0) and its id remains UNSOURCED. Identification attempt: research-order.md (#1 'Construction', unlocks Construction Parts I / Mechanical Parts / Electronics I) and research-tree.md ('Construction' [U4-verified], starting tech) give display names only; coi/data/research_ids.txt gives ids only; the planner dataset carries no research data at all; the API/bridge research captures carry ids only — NO project source holds an id-to-display-name mapping for research nodes. Sole candidate: ResearchCp1Production (research_ids.txt line 42; the save-string dump's Goal_ResearchCp1Production sits among the earliest goals, next to Goal_BuildResearchLab / Goal_BuildAssembly). 'Cp1' most plausibly reads 'Construction Parts 1', which fits the unlock list's first item but does NOT prove this node displays as 'Construction' — it could be a distinct production node. Per format §4.5 the placeholder therefore STAYS and the candidate is documented, not substituted. Resolution path: read the id off the in-game research screen (or the companion research page on a v0.6.2+ bridge, whose `researched` list gives real ids) on a fresh save before phase 2 is first entered."
      source: "research-order.md; research-tree.md; coi/data/research_ids.txt; coi-save-reader/probe/strings_all.txt; daxfb dataset (no research section)"
      status: unsourced-id-investigated

globals:
  autonomy:
    sim-control: confirm           # pause may be auto-applied by invariants/checks per format §5.2/§7.1; speed changes confirm
    research: confirm
    pins-alerts: auto
    global-priority: confirm
    entity-settings: confirm
    storage: confirm
    trade-contracts-loans: confirm
    vehicles-logistics: confirm
    trains: manual-only
    construction: manual-only      # format G3: placement semantics untested
    deconstruction: banned         # replacement live before demolition; demolition is a human decision
    manual: manual-only
  banned_commands: [GameConsoleCmd]
  invariants:
    - {metric: settlement.starving, op: "==", value: false}
    - {metric: settlement.homeless, op: "==", value: 0}
    - {metric: product.quantity, product: Product_Diesel, op: ">", value: 0,
       note: "Armed from t0 per the starting-diesel assumption above; phase 0 verifies the assumption before first unpause."}
  checks:
    - id: global-food-floor
      every: {minutes: 5}
      when: {metric: settlement.months_of_food, op: "<", value: 1}
      severity: critical
      action: pause-and-report
      note: "Food is a settlement-existential; monthsOfFood < 1 means the buffer is nearly gone regardless of phase."
  crisis_protocol:
    trigger_note: >-
      The death-spiral trio (fuel, maintenance, electricity) from
      bottlenecks.md: lose one and everything cascades. Crisis beats
      plan — phase progression suspends while this runs.
    orders:
      - id: crisis-pause-research
        do: ResearchStopCmd
        args: {}
        note: "Frees Unity and worker capacity (bottlenecks.md crisis step 1). ResearchStopCmd takes no args in the catalogue."
        class: research
      - id: crisis-pause-game-briefly
        do: SetSimPauseStateCmd
        args: {isPaused: true}
        note: "Stop the clock while the human assesses; unpausing is a human decision."
        class: sim-control
      - id: crisis-human-triage
        do: manual-step
        step: >-
          In the UI: (1) pause all non-essential production (ToggleEnabledCmd
          per machine may be prepared by the agent instead, entity-settings,
          confirm); (2) divert iron to mechanical parts to feed the
          maintenance depot; (3) Unity-boost the maintenance depot
          (manual only — no catalogue command spends Unity, format G5);
          (4) confirm diesel generators sit on the OUTPUT side of fuel
          storage so a fuel hiccup cannot kill power.
        why: "bottlenecks.md crisis response steps 2-4; several levers have no command-channel equivalent."
        class: manual
        completion: human-confirm

phases:

  # ------------------------------------------------------------------
  - id: phase-0-scout-bootstrap
    name: "Scout & bootstrap"
    intent: >-
      Pause, look, verify the plan's hypotheses against the actual save,
      pin the vital products, and queue nothing yet. No building happens
      in this phase; it exists so every later gate reads observed state,
      not the layout-policy hypotheses.
    skippable: false
    entry_gate: []                 # first phase; entered at run start
    orders:
      - id: p0-pause
        do: SetSimPauseStateCmd
        args: {isPaused: true}
        note: "Starter phase 1 opens with 'pause, scout'. Verified command."
        class: sim-control
        verify:
          - {metric: game.paused, op: "==", value: true}
      - id: p0-scout-layers
        do: manual-step
        step: >-
          Open the Layers view (resource overlays) and record: oil patch
          bearing/distance from the comms station, coal deposit, limestone,
          iron deposit distance, coastline and shipyard position to the
          south. Use the terrain inspector (Shift+L) on candidate mine
          spots to see ore layers. Do NOT place anything yet.
        why: "layout-policy.md: starting-area details are a reported hypothesis; verify against the actual save before any tile-level placement."
        class: manual
        completion: human-confirm
      - id: p0-verify-starting-state
        do: observe-only
        observe: >-
          Record the opening snapshot: Product_Diesel / Product_IronScrap /
          Product_ConcreteSlab / Product_Copper quantities; population and
          housing from bridge status; researchedCount baseline (needed for
          research.completed observation, format G1). Compare against the
          plan assumptions and report every mismatch to the human. If
          Product_Diesel == 0, STOP: the globals diesel invariant must be
          amended by a human before unpausing.
        class: manual
      - id: p0-claim-tutorial-freebies
        do: manual-step
        step: "Claim any tutorial-goal freebies the game offers."
        why: "Starter phase 1: 'claim any tutorial-goal freebies'."
        class: manual
        completion: human-confirm
      - id: p0-pin-vitals
        do: PinToggleCmd
        args: {productToToggle: Product_Diesel}
        note: "Pin the death-spiral vitals so they are visible on the HUD from hour one. Repeat this order shape for Product_IronScrap and Product_ConstructionParts once unlocked (ConstructionParts may not be unlocked at t0 — its product.unlocked precondition will simply hold the order until phase 2)."
        class: pins-alerts
        verify:
          - {metric: product.pinned, product: Product_Diesel, op: "==", value: true}
    checks:
      - id: p0-diesel-assumption
        every: {minutes: 5}
        when: {metric: product.quantity, product: Product_Diesel, op: "==", value: 0}
        severity: critical
        action: pause-and-report
        note: "Fires only if the starting-diesel assumption is wrong at t0; after phase 4 the same signal is a real fuel crisis and phase checks take over."
    exit_gate:
      - {metric: settlement.population, op: ">", value: 0}
      - {metric: settlement.free_housing, op: ">=", value: 0}
    fallbacks:
      on_gate_stall: pause-and-report
      stall_after: {months: 1}

  # ------------------------------------------------------------------
  - id: phase-1-scrap-starter
    name: "Scrap-fed starter cluster"
    intent: >-
      Consume the comms-station scrap pile in a DISPOSABLE starter cluster:
      scrap smelter (1 blast furnace + 2 casters), wood-burning coal maker,
      diesel generator, two research labs, tree-clearing designations,
      controlled ocean dumping. Start the research queue. Nothing built
      here is permanent (layout policy).
    skippable: false
    entry_gate:
      - {metric: product.quantity, product: Product_IronScrap, op: ">", value: 0}
    orders:
      - id: p1-research-construction
        do: ResearchStartCmd
        args:
          nodeId: {placeholder: "Research<Construction>", display_name: "Construction",
                   status: unsourced-id,
                   candidates: ["ResearchCp1Production — sole candidate (research_ids.txt line 42; Goal_ResearchCp1Production sits among the earliest goal strings). 'Cp1' plausibly = 'Construction Parts 1', matching this node's first unlock, but NO project source maps research ids to display names (checked research-order.md, research-tree.md, the planner dataset, API/bridge captures), so identity is unproven — do NOT assume it is this node. See the plan-level assumption 're-investigated 2026-11-03' for the full reasoning."],
                   confirm: "Read the node id off the in-game research screen / companion research page before first use."}
        note: "Research order #1 (research-order.md): unlocks assemblies, Construction Parts I, Mechanical Parts, Electronics I. Display name 'Construction' is U4-verified (research-tree.md) and the tree calls it a starting tech — it may already be complete at t0, in which case this order is skipped by its verify. No exact id exists in the extracted id list, hence the placeholder: this order is manual-only until the id is sourced."
        class: research
        flags: [placeholder-id]
        verify:
          - {metric: research.researched_count, op: ">=", value: 1}
      - id: p1-research-queue-first15
        do: manual-step
        step: >-
          Queue the first-15 research list (research-order.md) up front in
          the research UI, in the order the phases below consume it:
          Construction; Power & Maintenance; Trading Dock; Vehicles &
          Mining; Beacon; Tools; Concrete Production; Basic Diesel;
          Synthetic Rubber; Copper Refinement; Construction II; Conveyor
          Belts; Ship Dock Repair; Groundwater Pump; Fuel Station.
          Two labs keep research ahead of building.
        why: "The per-node ResearchQueueDequeueCmd orders live in their consuming phases (so gates stay honest); this step is the starter skill's queue-up-front instruction, done by the human because several node ids are placeholders/candidates that must be eyeballed against the research screen while queueing."
        class: manual
        completion: human-confirm
      - id: p1-build-starter-cluster
        do: place-blueprint
        blueprint_ref: "starter-cluster/scrap-smelter-1furnace-2caster-plus-coal-maker"
        asset_status: authored
        pack_slug: iron-v1
        district: starter-cluster
        note: "Degrades to a manual build from layout-policy.md's temporary list: first scrap smelter (1 blast furnace + 2 casters on scrap), wood-burning coal maker, diesel generator placed on the OUTPUT side of fuel storage, two research labs. Starter cluster is disposable — build cheap, near the comms station/docks, never anchor a permanent build here."
        class: construction
        completion: human-confirm
      - id: p1-tree-clearing-and-dumping
        do: manual-step
        step: >-
          Designate tree clearing around the starter cluster, and set
          controlled ocean waste dumping on the 'flat' setting in a zone
          AWAY from the ship's docking spot (dumping extends coastline
          into future building land; keep the south/east coastline stretch
          reserved for the future big harbour — do not build or dump on it).
        why: "Starter phase 1 + layout policy rules 2 and 4."
        class: manual
        completion: human-confirm
      - id: p1-resume-time
        do: GameSpeedChangeCmd
        args: {newSpeedMultiplier: 1}
        note: "Scout is done: run at speed 1 while the starter cluster goes up (a human unpauses — SetSimPauseStateCmd {isPaused: false} — as the companion order to this one; both are verified sim-control commands, confirm class in this plan)."
        class: sim-control
        verify:
          - {metric: game.speed, op: "==", value: 1}
      - id: p1-research-power-maintenance-early-flag
        do: observe-only
        observe: >-
          Watch the research queue: Power & Maintenance is order #2 in
          this plan (maintenance-before-anything-else). The source skill
          flags an order variant — some guides take it after Trading
          Dock. The variant is recorded here, not silently resolved.
        flags: [single-source]
        class: manual
    checks:
      - id: p1-scrap-runway
        every: {minutes: 5}
        when: {metric: product.quantity, product: Product_IronScrap, op: "<", value: 100}
        severity: warning
        action: pause-and-report
        note: "Scrap is finite: below this, phase 3 (mining) stops being optional. Threshold is a plan-set target."
      - id: p1-diesel-floor
        every: {minutes: 5}
        when: {metric: product.quantity, product: Product_Diesel, op: "<", value: 100}
        severity: critical
        action: crisis-protocol
        note: "Death-spiral trio, fuel leg (bottlenecks.md)."
    exit_gate:
      - {metric: product.quantity, product: Product_Iron, op: ">=", value: 100}
      - {metric: research.has_active_lab, op: "==", value: true}
      - any:
          - {metric: research.current, op: "!=", value: none}
          - {metric: research.queue_length, op: ">", value: 0}
    fallbacks:
      on_gate_stall: pause-and-report
      stall_after: {months: 2}
      on_check_fail: crisis-protocol

  # ------------------------------------------------------------------
  - id: phase-2-assembly-power-maintenance
    name: "Assembly + power & maintenance stability"
    intent: >-
      Construction researched → ~4 manual assemblies near the smelter
      (construction parts priority 1, then mechanical parts, then
      electronics), maintenance depot online, one farm near the
      settlement. This is the power+maintenance stability phase:
      maintenance must never stall from here on.
    skippable: false
    entry_gate:
      - metric: research.completed
        node: {placeholder: "Research<Construction>", display_name: "Construction",
               status: unsourced-id,
               candidates: ["ResearchCp1Production — sole candidate, identity unproven (see p1-research-construction and the plan-level assumption); NOT substituted in v1.2.0"],
               confirm: "Same placeholder as p1-research-construction; resolves when that order's id is sourced."}
      - {metric: product.quantity, product: Product_Iron, op: ">=", value: 100}
    orders:
      - id: p2-research-power-and-maintenance
        do: ResearchStartCmd
        args: {nodeId: ResearchPowerAndMaintenance}
        note: "Research order #2. Display name 'Power & Maintenance' is U4-verified (research-tree.md, wiki Required Research on Diesel Generator + Maintenance Depot). ID ambiguity flagged: research_ids.txt contains BOTH ResearchPowerAndMaintenance and ResearchPowerMaintenance — confirm on the research screen which is the live early node before applying; if it is the other, amend the plan (version bump) rather than guessing."
        class: research
        flags: [single-source, id-ambiguity]
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchPowerAndMaintenance}
              - {metric: research.queue_contains, node: ResearchPowerAndMaintenance, op: "==", value: true}
      - id: p2-build-assemblies
        do: place-blueprint
        blueprint_ref: "starter-cluster/manual-assemblies-x4"
        asset_status: authored
        pack_slug: starter-assemblies-v1
        district: starter-cluster
        note: "Manual build until authored: ~4 manual assemblies near the smelter. Recipe priority: construction parts FIRST (the eternal early bottleneck), then mechanical parts, then electronics (starter phase 2)."
        class: construction
        completion: human-confirm
      - id: p2-enable-construction-parts-recipe
        do: manual-step
        step: "Set one manual assembly to the Construction Parts I recipe and confirm it is producing; set a second to Mechanical Parts once construction parts flow."
        why: "MachineToggleRecipeActiveCmd exists (verified) but needs a runtime machine id + exact recipe id, neither sourced for a fresh save; the recipe choice is the human's until entity resolution is exercised in sandbox. Agent may prepare the command form in-session once the assembly's entity id is known from census/topology."
        class: manual
        completion: human-confirm
      - id: p2-build-maintenance-depot
        do: place-blueprint
        blueprint_ref: "starter-cluster/maintenance-depot"
        asset_status: not-yet-authored
        district: starter-cluster
        note: "Maintenance depot online in this phase (starter phase 2). Temporary siting is acceptable — it moves with the districts later."
        class: construction
        completion: verify-predicates
        verify:
          - {metric: census.proto_count, proto: MaintenanceDepotT1, op: ">=", value: 1, flags: [proto-id-unconfirmed]}
      - id: p2-build-first-farm
        do: place-blueprint
        blueprint_ref: "starter-cluster/first-farm"
        asset_status: not-yet-authored
        district: settlement-edge
        note: "One farm near the settlement (starter phase 2). Crop assignment is manual: FarmAssignCropCmd exists (wired) but crop proto ids are not sourced in the starter material, so no crop id is written here."
        class: construction
        completion: human-confirm
      - id: p2-pin-construction-parts
        do: PinToggleCmd
        args: {productToToggle: Product_ConstructionParts}
        note: "Construction parts are the phase-spanning bottleneck; keep them pinned."
        class: pins-alerts
        preconditions:
          - {metric: product.unlocked, product: Product_ConstructionParts, op: "==", value: true}
        verify:
          - {metric: product.pinned, product: Product_ConstructionParts, op: "==", value: true}
    checks:
      - id: p2-construction-parts-starvation
        every: {minutes: 5}
        when:
          all:
            - {metric: product.quantity, product: Product_ConstructionParts, op: "==", value: 0}
            - {metric: product.net_flow, product: Product_ConstructionParts, window: thisMonth, op: "<", value: 0}
        severity: warning
        action: pause-and-report
        note: "Construction-parts starvation (bottlenecks.md): do not overbuild fabrication to compensate — 'don't rush' is the source's explicit warning; report and let the human decide."
      - id: p2-maintenance-proxy
        every: {minutes: 5}
        when: {metric: census.machine_state_share, proto: "*", state: NotEnoughInput, op: ">", value: 0.5}
        severity: critical
        action: crisis-protocol
        note: "Maintenance has no product id and no stock route (format G6) — a broad NotEnoughInput share across machines is the observable proxy for the maintenance/power legs of the death-spiral trio. Crude by design; the companion detectors refine it."
      - id: p2-diesel-floor
        every: {minutes: 5}
        when: {metric: product.quantity, product: Product_Diesel, op: "<", value: 100}
        severity: critical
        action: crisis-protocol
    exit_gate:
      - {metric: research.completed, node: ResearchPowerAndMaintenance}
      - {metric: census.proto_count, proto: MaintenanceDepotT1, op: ">=", value: 1, flags: [proto-id-unconfirmed]}
      - all:
          - any:
              - {metric: product.produced, product: Product_ConstructionParts, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_ConstructionParts, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_ConstructionParts, window: lastMonth, op: ">=", value: 0}
        for: {months: 1}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
      - {metric: product.quantity, product: Product_MechanicalParts, op: ">", value: 0}
    fallbacks:
      on_gate_stall: pause-and-report
      stall_after: {months: 2}
      on_check_fail: crisis-protocol

  # ------------------------------------------------------------------
  - id: phase-3-mining-vehicles
    name: "Mining & vehicles"
    intent: >-
      Vehicles & Mining ends reliance on the scrap pile: coal mine first
      (retiring the coal maker smoothly), then iron mine + ore smelter
      anchoring the PERMANENT smelting district, truck fleet grown
      aggressively for the long iron haul.
    skippable: false
    entry_gate:
      - {metric: research.completed, node: ResearchPowerAndMaintenance}
      - all:
          - any:
              - {metric: product.produced, product: Product_ConstructionParts, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_ConstructionParts, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_ConstructionParts, window: lastMonth, op: ">=", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
    orders:
      - id: p3-research-trading-dock
        do: ResearchStartCmd
        args: {nodeId: ResearchTradeDock}
        note: "Research order #3. Display name in sources is 'Trading Dock' (U4-verified); the game id spells it TradeDock. The dock is the emergency bailout — it buys any shortage and prevents game-over. Placement note from the source: needs only -2 ocean depth since v0.8.1, much easier early placement."
        class: research
        flags: [id-spelling-differs-from-display]
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchTradeDock}
              - {metric: research.queue_contains, node: ResearchTradeDock, op: "==", value: true}
      - id: p3-research-vehicles-mining
        do: ResearchStartCmd
        args: {nodeId: ResearchVehicleAndMining}
        note: "Research order #4. Display name 'Vehicles & Mining' is U4-verified; the game id is singular 'Vehicle'. Unlocks vehicle depot, Mine Control Tower, Ore Sorting Plant (research-order.md)."
        class: research
        flags: [id-spelling-differs-from-display]
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchVehicleAndMining}
              - {metric: research.queue_contains, node: ResearchVehicleAndMining, op: "==", value: true}
      - id: p3-build-coal-mine
        do: place-blueprint
        blueprint_ref: "mining/coal-mine-first"
        asset_status: not-yet-authored
        district: coal-mine
        note: "Coal mine FIRST (starter phase 3), sited per the phase-0 scout. Keep mine edges well back from permanent processing — veins run below sea level and terrain collapses into pits (layout policy rule 3)."
        class: construction
        completion: human-confirm
      - id: p3-retire-coal-maker
        do: manual-step
        step: >-
          Decommission the wood-burning coal maker SMOOTHLY, in this order:
          stop truck imports of wood to it, let it burn its remaining wood,
          and only then remove it — removal itself is a human in-UI act
          (deconstruction is banned for the agent in this plan).
        why: "Starter phase 3 prescribes the smooth retirement sequence; the plan encodes the sequence, not a demolition order."
        class: manual
        completion: human-confirm
      - id: p3-build-iron-mine-and-ore-smelter
        do: place-blueprint
        blueprint_ref: "smelting-district/ore-smelter-anchor"
        asset_status: authored
        pack_slug: iron-v1
        pack_slug_overlay: iron-v2
        district: smelting-district
        note: "Iron mine + ore-based smelter. The ore smelter ANCHORS the permanent smelting district — place thoughtfully in the reserved inland area, not in the starter cluster (layout policy). This is the phase's one permanent siting decision."
        class: construction
        completion: human-confirm
      - id: p3-grow-truck-fleet
        do: AddVehicleToBuildQueueCmd
        args:
          protoId: {placeholder: "VehicleProto<pickup>", display_name: "small pickup truck",
                    status: unsourced-id, confirm: "Vehicle proto ids are not in the starter material; source from the vehicle depot UI / game data before use."}
          vehicleDepotId: {$entity: {proto: VehiclesDepotT1, match: only}, flags: [proto-id-unconfirmed]}
          count: 2
        note: "Grow the fleet aggressively for the iron haul (starter phase 3), but keep it lean — small vehicles are upgraded manually later (unassign → scrap → rebuild), so do not over-invest (bottlenecks.md). Wired command (not verified); the proto placeholder makes this order manual-only until sourced."
        class: vehicles-logistics
        flags: [placeholder-id, wired-command]
      - id: p3-research-beacon
        do: ResearchStartCmd
        args: {nodeId: ResearchBeacon}
        note: "Research order #5 (U4-verified id). Refugee waves are 16 pops each — see the beacon check below; the beacon gets switched OFF before housing is exceeded."
        class: research
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchBeacon}
              - {metric: research.queue_contains, node: ResearchBeacon, op: "==", value: true}
      - id: p3-research-tools
        do: ResearchStartCmd
        args: {nodeId: ResearchTools}
        note: "Research order #6: the QoL suite (copy/cut, copy settings, Unity tool, pause tool, upgrade, planning mode) that makes every later build faster."
        class: research
    checks:
      - id: p3-beacon-housing-guard
        every: {minutes: 5}
        when: {metric: settlement.free_housing, op: "<", value: 16}
        severity: warning
        action: pause-and-report
        note: "One refugee wave is 16 pops. If free housing < 16 and the beacon is on, the next wave over-accepts past capacity and costs Unity (research-order.md / bottlenecks.md). Refugee acceptance itself has no catalogue command (format G9) — switching the beacon off is a manual step the human takes from this report."
      - id: p3-truck-congestion-signal
        every: {minutes: 15}
        when: {metric: product.net_flow, product: Product_IronOre, window: thisMonth, op: "==", value: 0}
        severity: warning
        action: pause-and-report
        note: "Proxy only: 'trucks extremely busy' is a UI signal with no API equivalent. Zero iron-ore flow while the mine exists usually means logistics, not geology — scale the fleet, don't tune around it (bottlenecks.md)."
      - id: p3-diesel-floor
        every: {minutes: 5}
        when: {metric: product.quantity, product: Product_Diesel, op: "<", value: 150}
        severity: critical
        action: crisis-protocol
        note: "Floor raised vs phase 2: the truck fleet is now a diesel consumer at scale. Plan-set target."
    exit_gate:
      - {metric: research.completed, node: ResearchVehicleAndMining}
      - {metric: product.quantity, product: Product_Coal, op: ">=", value: 200}
      - all:
          - any:
              - {metric: product.produced, product: Product_IronOre, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_IronOre, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_IronOre, window: lastMonth, op: ">", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
      - all:
          - any:
              - {metric: product.produced, product: Product_Iron, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_Iron, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_Iron, window: lastMonth, op: ">=", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
    fallbacks:
      on_gate_stall: pause-and-report
      stall_after: {months: 2}
      on_check_fail: crisis-protocol

  # ------------------------------------------------------------------
  - id: phase-4-concrete-diesel-rubber
    name: "Concrete, diesel & rubber"
    intent: >-
      The transitional industry phase: limestone mine + kiln for concrete,
      oil pumps + basic distiller + rubber maker at the oil patch. Rubber
      and copper cannot be postponed — this phase ends with a REAL diesel
      chain replacing the starting stock, and rubber flowing.
    skippable: false
    entry_gate:
      - {metric: research.completed, node: ResearchVehicleAndMining}
      - {metric: product.quantity, product: Product_Coal, op: ">=", value: 200}
    orders:
      - id: p4-research-concrete-production
        do: ResearchStartCmd
        args:
          nodeId: {placeholder: "Research<ConcreteProduction>", display_name: "Concrete Production",
                   status: unsourced-id,
                   candidates: ["ResearchConcreteAdvanced (exists in research_ids.txt but is a LATER 'advanced' node per its name — do NOT substitute it for this early node)"],
                   confirm: "Read the node id off the in-game research screen before first use."}
        note: "Research order #7. Display name 'Concrete Production' is U4-verified (research-tree.md: wiki Required Research on Crusher, Rotary Kiln, Concrete Mixer) — but no matching id exists in the extracted id list, so this stays a placeholder and the order is manual-only until sourced. Never write 'Basic Concrete' — that name is explicitly superseded."
        class: research
        flags: [placeholder-id]
      - id: p4-build-limestone-kiln-concrete
        do: place-blueprint
        blueprint_ref: "concrete-district/kiln-plus-mixer-first"
        asset_status: authored
        pack_slug: concrete-v1
        district: concrete-district
        note: "Limestone mine + rotary kiln + concrete mixer (starter phase 4), using the phase-0 scout's limestone position. Transitional siting: concrete production will be rebuilt at scale later; do not overbuild it here."
        class: construction
        completion: human-confirm
      - id: p4-research-basic-diesel
        do: ResearchStartCmd
        args: {nodeId: ResearchBasicDiesel}
        note: "Research order #8. Id exists in research_ids.txt; the exact display form 'Basic Diesel' is single-source in research-tree.md (Charles says 'diesel'; Medium guide corroborates the progression) — flag carried."
        class: research
        flags: [single-source]
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchBasicDiesel}
              - {metric: research.queue_contains, node: ResearchBasicDiesel, op: "==", value: true}
      - id: p4-build-basic-diesel-chain
        do: place-blueprint
        blueprint_ref: "oil-district/basic-diesel-3pumps-distiller"
        asset_status: authored
        pack_slug: diesel-v1
        district: oil-district
        note: "At the oil patch (phase-0 scout): 3 oil pumps + basic distiller, wastewater dumped — layout policy explicitly calls this design 'not the most scalable' and temporary. Diesel generators stay on the output side of fuel storage (bottlenecks.md structural rule)."
        class: construction
        completion: human-confirm
      - id: p4-diesel-storage-alert
        do: StorageAlertSetEnabledCmd
        args:
          storageId: {$entity: {proto: StorageFluidT2, product: Product_Diesel, match: first}, flags: [proto-id-unconfirmed]}
          isEnabled: true
          isAbove: false
        note: "Turn on the game's own storage alert for the diesel buffer, firing when the level falls BELOW its threshold (SPEC §12.7: align with native alerts rather than duplicating them). Arg names verified against live/commands.json 2026-11-02 (storageId / isEnabled / isAbove). StorageAlertSetThresholdCmd (wired) may set the level in-session."
        class: pins-alerts
        flags: [args-recheck-at-prepare]
      - id: p4-research-synthetic-rubber
        do: ResearchStartCmd
        args:
          nodeId: {placeholder: "Research<SyntheticRubber>", display_name: "Synthetic Rubber",
                   status: unsourced-id,
                   candidates: ["ResearchRubber", "ResearchRubberProduction"],
                   confirm: "Two candidate ids exist in research_ids.txt; pick the one the research screen shows for the rubber-maker unlock, then amend the plan."}
        note: "Research order #9. 'Cannot be postponed: no rubber → no vehicles/electronics → no maintenance → death spiral' (research-order.md). Display name is single-source (Steam list; Charles says 'rubber'). Placeholder because two candidate ids exist and choosing silently would be inventing."
        class: research
        flags: [placeholder-id, single-source]
      - id: p4-build-rubber-maker
        do: place-blueprint
        blueprint_ref: "oil-district/rubber-maker"
        asset_status: authored
        pack_slug: rubber-v1
        district: oil-district
        note: "Rubber maker next to the basic diesel chain (starter phase 4)."
        class: construction
        completion: human-confirm
    checks:
      - id: p4-diesel-net-flow
        every: {minutes: 5}
        when:
          all:
            - {metric: product.produced, product: Product_Diesel, window: lifetime, op: ">", value: 0}
            - {metric: product.net_flow, product: Product_Diesel, window: thisMonth, op: "<", value: 0}
        severity: warning
        action: pause-and-report
        note: "Once the basic diesel chain exists, a negative monthly diesel balance is the earliest death-spiral warning — earlier than any stock floor. Diesel chain guard (Round 5): the lifetime-produced sibling in the when: all: means this can only fire once a diesel chain has actually produced diesel — before that, a negative balance is ordinary starting-stock drawdown, not a chain deficit."
      - id: p4-rubber-deadline
        every: {minutes: 15}
        when:
          all:
            - {metric: research.completed, node: ResearchBasicDiesel, op: "==", value: true}
            - {metric: product.quantity, product: Product_Rubber, op: "==", value: 0}
        severity: warning
        action: pause-and-report
        note: "Diesel done but zero rubber: the postponement trap bottlenecks.md names explicitly."
    exit_gate:
      - {metric: product.quantity, product: Product_ConcreteSlab, op: ">=", value: 100}
      - all:
          - any:
              - {metric: product.produced, product: Product_Diesel, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_Diesel, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_Diesel, window: lastMonth, op: ">=", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
      - {metric: product.quantity, product: Product_Rubber, op: ">", value: 0}
      - {metric: product.quantity, product: Product_Diesel, op: ">=", value: 300}
    fallbacks:
      on_gate_stall: pause-and-report
      stall_after: {months: 2}
      on_check_fail: crisis-protocol

  # ------------------------------------------------------------------
  - id: phase-5-copper-construction2-food
    name: "Copper, Construction II & food security"
    intent: >-
      Spend the ship's copper wisely while the permanent copper district
      (mine + smelter + electrolysis, near power — it is thirsty for water
      and power) comes online BEFORE the ship stock runs out. Construction
      II unlocks electric assemblies and the permanent conveyor-ready
      assembly area. Food security is gated explicitly here: the farm
      base must carry the settlement with margin.
    skippable: false
    entry_gate:
      - all:
          - any:
              - {metric: product.produced, product: Product_Diesel, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_Diesel, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_Diesel, window: lastMonth, op: ">=", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
      - {metric: product.quantity, product: Product_Rubber, op: ">", value: 0}
    orders:
      - id: p5-research-copper-refinement
        do: ResearchStartCmd
        args: {nodeId: ResearchCopperRefinement}
        note: "Research order #10 (U4-verified display name + exact id in research_ids.txt). Note: a separate ResearchCopper id also exists in the game data — if the research screen shows it as a prerequisite, queue it first (human confirms while queueing; the plan does not guess the prerequisite graph, which research-tree.md says is not publicly documented)."
        class: research
        flags: [prerequisite-graph-unconfirmed]
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchCopperRefinement}
              - {metric: research.queue_contains, node: ResearchCopperRefinement, op: "==", value: true}
      - id: p5-build-copper-district
        do: place-blueprint
        blueprint_ref: "copper-district/mine-smelter-electrolysis"
        asset_status: not-yet-authored
        district: copper-district
        note: "PERMANENT build (layout policy): copper mine + smelter + electrolysis, sited near the power district because electrolysis is thirsty for water and power. Likely needs a 3rd diesel generator (starter phase 5) — adding it is part of this build step, on the output side of fuel storage."
        class: construction
        completion: human-confirm
      - id: p5-research-construction-2
        do: ResearchStartCmd
        args:
          nodeId: {placeholder: "Research<ConstructionII>", display_name: "Construction II",
                   status: inferred-mapping,
                   candidates: ["ResearchCp2 (Cp2 = Construction Parts II; the mapping from the 'Construction II' display name to this id is INFERRED, not sourced)"],
                   confirm: "Confirm on the research screen that the candidate node unlocks electric assemblies / Construction Parts II before applying."}
        note: "Research order #11: electric assemblies (2x manual speed) + yellow construction parts; gateway to automation. Display name is single-source (research-tree.md: Steam list + Medium guide; Charles never says it)."
        class: research
        flags: [placeholder-id, single-source]
      - id: p5-build-permanent-assembly-area
        do: place-blueprint
        blueprint_ref: "assembly-district/permanent-conveyor-ready-v1"
        asset_status: not-yet-authored
        district: assembly-district
        note: "Start the PERMANENT conveyor-ready assembly area with storage buffers (starter phase 5). As it comes online, begin retiring disposable starter buildings — retirement means pause/stop first; any actual removal is a human act (deconstruction banned for the agent)."
        class: construction
        completion: human-confirm
      - id: p5-food-security-push
        do: manual-step
        step: >-
          Expand farming beyond the phase-2 single farm until the food
          buffer is visibly growing: additional farms near the settlement,
          crops assigned in the farm UI (crop proto ids unsourced — no
          FarmAssignCropCmd order is written in this plan). Keep food
          variety simple at this stage; the gate below (monthsOfFood) is
          the arbiter, not farm count.
        why: "The starter skill seeds one farm in phase 2 and treats food as a settlement commitment (refugees/housing); this plan makes food security an explicit gated phase outcome using the bridge status route, which is the only honest food metric available."
        class: manual
        completion: verify-predicates
        verify:
          - {metric: settlement.months_of_food, op: ">=", value: 3}
    checks:
      - id: p5-ship-copper-runway
        every: {minutes: 15}
        when:
          all:
            - {metric: product.quantity, product: Product_Copper, op: "<", value: 100}
            - {metric: product.net_flow, product: Product_CopperOre, window: thisMonth, op: "<=", value: 0}
        severity: critical
        action: pause-and-report
        note: "The ship's copper stock is finite (layout policy). Low copper + no copper-ore flow = the copper district is late. Threshold is a plan-set target."
      - id: p5-food-floor
        every: {minutes: 5}
        when: {metric: settlement.months_of_food, op: "<", value: 2}
        severity: critical
        action: pause-and-report
        note: "Stricter than the global floor: this phase's whole point is food security, so it reports earlier."
      - id: p5-power-proxy
        every: {minutes: 5}
        when: {metric: census.machine_state_share, proto: "*", state: NotEnoughInput, op: ">", value: 0.4}
        severity: warning
        action: pause-and-report
        note: "No power route exists (format G2): electrolysis + a 3rd generator change the power balance, and a rising starved share is the available proxy. Do not gate on MW — there is no MW source."
    exit_gate:
      - {metric: research.completed, node: ResearchCopperRefinement}
      - all:
          - any:
              - {metric: product.produced, product: Product_Copper, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_Copper, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_Copper, window: lastMonth, op: ">=", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
      - {metric: settlement.months_of_food, op: ">=", value: 3, for: {months: 1}}
      - {metric: settlement.starving, op: "==", value: false}
    fallbacks:
      on_gate_stall: pause-and-report
      stall_after: {months: 2}
      on_check_fail: crisis-protocol

  # ------------------------------------------------------------------
  - id: phase-6-automation-expansion
    name: "Automation & expansion districts"
    intent: >-
      Conveyor Belts kill the truck chaos: electric assemblies, belt-fed
      lines, unit storages with keep-full import rules — one dedicated
      line per product, no sushi belts. Ship repaired, groundwater and
      fuel station round out the first-15. Districts from the layout
      policy become the map's permanent shape.
    skippable: false
    entry_gate:
      - {metric: research.completed, node: ResearchCopperRefinement}
      - {metric: settlement.months_of_food, op: ">=", value: 3}
    orders:
      - id: p6-research-conveyor-belts
        do: ResearchStartCmd
        args: {nodeId: ResearchConveyorBelts}
        note: "Research order #12 (U4-verified display name; exact id in research_ids.txt). Flag: a ResearchConveyors id also exists — if the screen shows Conveyors as the belt-unlocking node instead, amend the plan rather than guessing."
        class: research
        flags: [id-ambiguity]
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchConveyorBelts}
              - {metric: research.queue_contains, node: ResearchConveyorBelts, op: "==", value: true}
      - id: p6-belt-the-permanent-lines
        do: manual-step
        step: >-
          Belt-feed the permanent assembly district: one dedicated line
          per product, no sushi belts, no permanent multi-recipe
          factories (starter phase 6). Unit storages get keep-full import
          rules — set them in the storage UI; the agent may prepare
          StorageSetSliderStepCmd (wired) per storage in-session once the
          storage entity id is resolved from the bridge storages route,
          but slider VALUES are not readable back (format G7), so verify
          is human-confirm.
        why: "Belts are placement (format G3) and sliders are write-only state (G7); both stay human-led in v1 of this plan."
        class: manual
        completion: human-confirm
      - id: p6-research-ship-dock-repair
        do: ResearchStartCmd
        args: {nodeId: ResearchShipDockRepair}
        note: "Research order #13 (U4-verified). A ResearchRepairDock id also exists (likely the dock building repair line) — flagged, not conflated."
        class: research
        flags: [id-ambiguity]
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchShipDockRepair}
              - {metric: research.queue_contains, node: ResearchShipDockRepair, op: "==", value: true}
      - id: p6-repair-ship-and-explore
        do: manual-step
        step: >-
          Repair the capital ship at the shipyard and begin world-map
          exploration (offshore oil is the phase-7 prize). Shipyard
          commands exist (wired) but repair flow semantics are untested;
          the human drives this in the UI.
        why: "Starter phase 7 opens with ship repair → world map → offshore oil."
        class: manual
        completion: human-confirm
      - id: p6-research-groundwater-pump
        do: ResearchStartCmd
        args:
          nodeId: {placeholder: "Research<GroundwaterPump>", display_name: "Groundwater Pump",
                   status: inferred-mapping,
                   candidates: ["ResearchUndergroundWater (name-adjacent id in research_ids.txt; mapping inferred, not sourced)"],
                   confirm: "Confirm on the research screen that the candidate unlocks the groundwater pump building."}
        note: "Research order #14 (display name U4-verified; id mapping inferred). Scalable water replaces rainwater collectors."
        class: research
        flags: [placeholder-id]
      - id: p6-research-fuel-station
        do: ResearchStartCmd
        args: {nodeId: ResearchFuelStation}
        note: "Research order #15 (U4-verified display name + exact id). Vehicle refuelling logistics — the truck fleet's diesel stops being hand-carried."
        class: research
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchFuelStation}
              - {metric: research.queue_contains, node: ResearchFuelStation, op: "==", value: true}
      - id: p6-build-fuel-station
        do: place-blueprint
        blueprint_ref: "logistics/fuel-station-first"
        asset_status: not-yet-authored
        district: starter-cluster
        note: "First fuel station near the vehicle depot / docks (vehicle depot siting is permanent per layout policy: near the docks)."
        class: construction
        completion: human-confirm
      - id: p6-next-research-note
        do: observe-only
        observe: >-
          Record for the NEXT plan (do not queue blindly): after the
          first 15, the source order is Advanced Diesel (id
          ResearchAdvancedDiesel exists) → Power Generation (coal boiler
          + steam turbine replacing diesel generators; candidate ids
          ResearchPowerGeneration2 / ResearchPowerGen2 are ambiguous —
          unsourced mapping) → Cargo Depot (id ResearchCargoDepot
          exists; explicit gate per a single-source community report: it
          cannot be researched until a cargo ship is discovered).
        flags: [single-source, unverified]
        class: manual
    checks:
      - id: p6-transport-connectivity
        every: {minutes: 15}
        when: {metric: census.transports_fully_connected_ratio, op: "<", value: 0.95}
        severity: warning
        action: pause-and-report
        note: "Belt conversion leaves dangling transports; the census transports block (total vs fullyConnected) is the observable. Threshold is a plan-set target."
      - id: p6-diesel-floor
        every: {minutes: 5}
        when: {metric: product.quantity, product: Product_Diesel, op: "<", value: 200}
        severity: critical
        action: crisis-protocol
    exit_gate:
      - {metric: research.completed, node: ResearchConveyorBelts}
      - {metric: research.completed, node: ResearchShipDockRepair}
      - {metric: research.completed, node: ResearchFuelStation}
      - all:
          - any:
              - {metric: product.produced, product: Product_ConstructionParts2, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_ConstructionParts2, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_ConstructionParts2, window: lastMonth, op: ">=", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
      - {metric: census.transports_fully_connected_ratio, op: ">=", value: 0.95}
    fallbacks:
      on_gate_stall: pause-and-report
      stall_after: {months: 2}
      on_check_fail: crisis-protocol

  # ------------------------------------------------------------------
  - id: phase-7-rail-introduction
    name: "Rail introduction (Trains Expansion DLC)"
    intent: >-
      First rail, honestly scoped: the starter skill hands rail off to
      the coi-trains sibling skill and notes the in-game train tutorials
      are new in Update 4 — use them. This phase stands up ONE network
      and ONE line on the longest truck haul (iron), built by hand,
      with the command-channel train primitives kept sandbox-only until
      their semantics are validated (format G3/G10).
    skippable: true                # the run is self-sufficient without rail; rail is an optimisation, not a lifeline
    entry_gate:
      - {metric: research.completed, node: ResearchFuelStation}
      - all:
          - any:
              - {metric: product.produced, product: Product_ConstructionParts2, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_ConstructionParts2, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_ConstructionParts2, window: lastMonth, op: ">=", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
      - {metric: settlement.months_of_food, op: ">=", value: 3}
    orders:
      - id: p7-research-trains
        do: ResearchStartCmd
        args: {nodeId: ResearchTrains}
        note: "DLC gate node. Id exists in research_ids.txt; display name 'Trains' is single-source in research-tree.md (DLC section). A ResearchTrains2 id also exists (later tier — not this phase). Diesel locomotives are a separate later node family (ResearchDieselLocomotiveT2 is T2; the base diesel-loco node id is NOT sourced here and is not guessed)."
        class: research
        flags: [single-source]
        verify:
          - any:
              - {metric: research.current, op: "==", value: ResearchTrains}
              - {metric: research.queue_contains, node: ResearchTrains, op: "==", value: true}
      - id: p7-train-tutorials
        do: manual-step
        step: "Complete the in-game train tutorials (new in Update 4) before laying any track."
        why: "Starter phase 7's explicit instruction: 'In-game train tutorials are new in Update 4 — use them.' Detailed rail design belongs to the coi-trains sibling skill, not this plan."
        class: manual
        completion: human-confirm
      - id: p7-build-first-line-manual
        do: manual-step
        step: >-
          Lay the first line by hand in the UI: a dedicated iron-ore
          shuttle, mine → smelting district, stations on sidings (never
          blocking a through route), load-only station at the mine and
          unload-only station at the smelter (a station cannot load and
          unload the same product — the relocation plan's station spec,
          applied here as doctrine), buffer storage >= 1 trainload at
          each end, fuel station on the route. Detailed consists and
          network rules come from the coi-trains skill.
        why: "Track/station placement semantics via CreateTrainTrackEntityWithDirectionCmd are untested (format G3/G10); manual laying is the honest v1 path."
        class: manual
        completion: verify-predicates
        verify:
          - {metric: trains.line_count, op: ">=", value: 1}
      - id: p7-create-network-command-sandbox-only
        do: CreateNewTrainNetworkCmd
        args: {}
        note: "Catalogue command (wired, no args). Recorded here so the plan names the real primitive — but it MUST NOT be applied to this run until sandbox validation is recorded (format §6.1). The in-UI equivalent in p7-build-first-line-manual is the v1 path."
        class: trains
        requires_sandbox_validation: true
        flags: [wired-command, sandbox-only]
      - id: p7-create-line-command-sandbox-only
        do: CreateNewTrainLineCmd
        args: {}
        note: "Same status as the network command: real catalogue primitive, wired, untested semantics. Sandbox-only in v1."
        class: trains
        requires_sandbox_validation: true
        flags: [wired-command, sandbox-only]
    checks:
      - id: p7-rail-not-starving-the-base
        every: {minutes: 15}
        when: {metric: product.net_flow, product: Product_Iron, window: thisMonth, op: "<", value: 0}
        severity: warning
        action: pause-and-report
        note: "If converting the iron haul to rail makes iron flow WORSE, the shuttle is wrong (blocked/mis-scheduled), not the plan — report with the trains route evidence."
    exit_gate:
      - {metric: research.completed, node: ResearchTrains}
      - {metric: trains.line_count, op: ">=", value: 1}
      - all:
          - any:
              - {metric: product.produced, product: Product_IronOre, window: lastMonth, op: ">", value: 0}
              - {metric: product.consumed, product: Product_IronOre, window: lastMonth, op: ">", value: 0}
          - {metric: product.net_flow, product: Product_IronOre, window: lastMonth, op: ">", value: 0}
        note: "Vacuous-window guard (Round 5): the activity sibling (produced or consumed > 0 in the same window) prevents this net_flow leaf reading TRUE on 0-0 when the window never existed or the product had no activity in it."
      - {metric: settlement.months_of_food, op: ">=", value: 3}
    fallbacks:
      on_gate_stall: skip-phase
      stall_after: {months: 3}
      on_check_fail: pause-and-report
