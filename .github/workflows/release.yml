# Builds the companion binary (coi.exe) on GitHub's runners and
# attaches it to a GitHub Release. The C# mods (CoiBridge, QoS suite)
# are NOT built here: they compile against the game's own assemblies,
# which cannot live in this repo — they build locally with
# COI_REFS_DIR pointing at a game install (see README, "Building").
name: companion-release

on:
  push:
    tags:
      - "coi-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build companion
        working-directory: coi
        run: cargo build --release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item coi/target/release/coi.exe dist/coi.exe
          (Get-FileHash dist/coi.exe -Algorithm SHA256).Hash.ToLower() + "  coi.exe" |
            Out-File -Encoding ascii dist/coi.exe.sha256

      - name: Upload workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v5
        with:
          name: coi-exe
          path: dist/*

      - name: Attach to release (tag runs)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/coi.exe
            dist/coi.exe.sha256
