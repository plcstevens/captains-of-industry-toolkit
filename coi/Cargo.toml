[package]
name = "coi"
version = "0.1.0"
edition = "2021"
description = "Companion CLI for Captain of Industry — reads the game's web API, snapshots, triage reports."
license = "MIT"

[dependencies]
serde_json = "1"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
getrandom = "0.3"

[profile.release]
opt-level = 3
