[package]
name = "superintendent"
version = "0.1.0"
edition = "2021"
description = "Superintendent — the companion website for Captain of Industry: live triage board, snapshots, and a prepare-confirm-audit command flow over the game's web API."
license = "MIT"

[dependencies]
serde_json = "1"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
getrandom = "0.4"

[profile.release]
opt-level = 3
